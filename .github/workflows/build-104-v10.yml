name: Build CarWithin 1.0.4 v10

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Fetch upstream source
        run: |
          set -euo pipefail
          curl -sL -o src.zip https://github.com/xmz28/CarWithin/archive/refs/tags/v1.0.4.zip
          unzip -q src.zip
          mv CarWithin-1.0.4 src

      - name: Fetch MFi identity into source tree
        run: |
          set -euo pipefail
          curl -sL -o official.ipa https://github.com/xmz28/CarWithin/releases/download/v1.0.4/CarWithin-1.0.4-unsigned.ipa
          unzip -q official.ipa -d ref
          mkdir -p src/App/BundledIdentity
          for f in certificate.p7b leaf.cer private.x963; do
            cp "ref/Payload/TDSCarKit.app/$f" "src/App/BundledIdentity/$f"
          done
          ls -l src/App/BundledIdentity

      - name: Patch v10 drop media audio formats, announcement retry and SSID log
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          changed = []

          # ===== v6: 音频能力 =====
          p = Path('src/App/ReceiverViewController.swift')
          s = p.read_text(encoding='utf-8')
          old = 'audioEnabled: soundOutput != .phone'
          n = s.count(old)
          assert n == 2, f'audio sites = {n}'
          s = s.replace(old, 'audioEnabled: true')
          p.write_text(s, encoding='utf-8')
          changed.append(f'audio sites: {n}')

          # ===== v7: 公告通道重试 + 60s 等待 =====
          p = Path('src/App/TailingConnection.swift')
          s = p.read_text(encoding='utf-8')

          old_log = '        log("\\(dashboard) TCP 已监听 \\(localIP):\\(ports.control)/\\(ports.auxiliary)/\\(ports.video)，正在协商")'
          new_log = '        log("\\(dashboard) TCP 已监听 \\(localIP):\\(ports.control)/\\(ports.auxiliary)/\\(ports.video)，仪表 \\(targetIP)，正在协商")'
          assert s.count(old_log) == 1, 'listen log line missing'
          s = s.replace(old_log, new_log)

          old_block = '''        let announcement = try tracked(TailingSocket.create())
                  defer { announcement.close() }
                  try announcement.connect(localIP: localIP, remoteIP: targetIP, port: ports.announcement)
                  try announcement.write(TailingProtocol.control(0x70000010, payload: TailingProtocol.json([
                      "phoneType": "iOS", "packageName": phone.package
                  ])))
                  let reply = try TailingProtocol.readControl { try announcement.readExactly($0, timeout: 3) }
                  guard reply.command == 0x70000011,
                        try TailingProtocol.object(reply.payload)["status"] as? Bool == true else {
                      throw TailingError.protocolFailure("仪表未接受 iOS 投屏请求")
                  }'''

          new_block = '''        var announced = false
                  for attempt in 1...6 where !announced {
                      do {
                          let announcement = try tracked(TailingSocket.create())
                          defer { announcement.close() }
                          try announcement.connect(localIP: localIP, remoteIP: targetIP, port: ports.announcement)
                          try announcement.write(TailingProtocol.control(0x70000010, payload: TailingProtocol.json([
                              "phoneType": "iOS", "packageName": phone.package
                          ])))
                          let reply = try TailingProtocol.readControl { try announcement.readExactly($0, timeout: 3) }
                          guard reply.command == 0x70000011,
                                try TailingProtocol.object(reply.payload)["status"] as? Bool == true else {
                              throw TailingError.protocolFailure("仪表未接受 iOS 投屏请求")
                          }
                          announced = true
                          log("\\(dashboard) 公告通道 \\(targetIP):\\(ports.announcement) 已通知仪表开始投屏")
                      } catch {
                          log("\\(dashboard) 公告通道第 \\(attempt) 次未接通（\\(error)），2 秒后重试")
                          if attempt < 6 { Thread.sleep(forTimeInterval: 2) }
                      }
                  }'''

          assert s.count(old_block) == 1, f'announcement block sites = {s.count(old_block)}'
          s = s.replace(old_block, new_block)

          old_deadline = '        let deadline = Date().addingTimeInterval(20)'
          new_deadline = '        let deadline = Date().addingTimeInterval(60)'
          assert s.count(old_deadline) == 1, 'deadline line missing'
          s = s.replace(old_deadline, new_deadline)
          p.write_text(s, encoding='utf-8')
          changed.append('announcement retry x6 + 60s deadline')

          # ===== v7: SSID 日志 + 预检容错 =====
          p = Path('src/App/NativeReceiver.swift')
          s = p.read_text(encoding='utf-8')
          old_import = 'import Foundation\nimport Network\n'
          new_import = 'import Foundation\nimport Network\nimport NetworkExtension\n'
          assert s.count(old_import) == 1, 'import block missing'
          s = s.replace(old_import, new_import)

          old_zeeho = '            if let target = configuration.zeehoAddress {'
          new_zeeho = '''            if let target = configuration.zeehoAddress {
                          NEHotspotNetwork.fetchCurrent { [weak self] network in
                              DispatchQueue.main.async { self?.log("当前 Wi-Fi：\\(network?.ssid ?? "未知（未授权定位）")") }
                          }'''
          assert s.count(old_zeeho) == 1, 'zeeho anchor missing'
          s = s.replace(old_zeeho, new_zeeho)

          old_pre = '                } catch { self.fail("无线音频编解码器不可用：\\(error.localizedDescription)"); return }'
          new_pre = '                } catch { self.log("音频编解码器预检失败，继续尝试：\\(error.localizedDescription)") }'
          assert s.count(old_pre) == 1, 'preflight site missing'
          s = s.replace(old_pre, new_pre)
          p.write_text(s, encoding='utf-8')
          changed.append('SSID log + preflight tolerant')

          # ===== v8: 允许蓝牙 A2DP 输出，优先于扬声器覆盖 =====
          p = Path('src/App/CarPlayAudio.swift')
          s = p.read_text(encoding='utf-8')

          old_options = '                var options: AVAudioSession.CategoryOptions = needsDuplexCategory ? [.defaultToSpeaker] : []'
          new_options = '                var options: AVAudioSession.CategoryOptions = needsDuplexCategory ? [.defaultToSpeaker, .allowBluetoothA2DP] : []'
          assert s.count(old_options) == 1, 'options line missing'
          s = s.replace(old_options, new_options)

          old_branch = '''                    do {
                                  try session.overrideOutputAudioPort(.speaker)
                                  Self.hasSpeakerOverride = true
                                  onLog?("本机音频避开 CarPlay 路由，改用 iPhone 扬声器")
                              } catch {
                                  Self.deactivateSessionIfIdle()
                                  throw error
                              }'''
          new_branch = '''                    var routedToBluetooth = false
                              for _ in 0..<4 {
                                  if session.currentRoute.outputs.contains(where: { $0.portType == .bluetoothA2DP }) {
                                      routedToBluetooth = true; break
                                  }
                                  Thread.sleep(forTimeInterval: 0.05)
                              }
                              if routedToBluetooth {
                                  onLog?("本机音频改走蓝牙 A2DP，跳过扬声器覆盖")
                              } else {
                                  do {
                                      try session.overrideOutputAudioPort(.speaker)
                                      Self.hasSpeakerOverride = true
                                      onLog?("本机音频避开 CarPlay 路由，改用 iPhone 扬声器")
                                  } catch {
                                      Self.deactivateSessionIfIdle()
                                      throw error
                                  }
                              }'''

          assert s.count(old_branch) == 1, f'override branch sites = {s.count(old_branch)}'
          s = s.replace(old_branch, new_branch)
          p.write_text(s, encoding='utf-8')
          changed.append('prefer Bluetooth A2DP over speaker override')

          print('PATCHED')
          for c in changed:
              print(' -', c)

          # ===== v9: 尝试接回蓝牙 A2DP（CarPlay 下发 disableBluetooth 后路由被抢走）=====
          p = Path('src/App/CarPlayAudio.swift')
          s = p.read_text(encoding='utf-8')

          old_static = '''    private static var playingStreams = 0
              #if os(iOS)
              private static var hasSpeakerOverride = false
              #endif'''
          new_static = r'''    private static var playingStreams = 0
              #if os(iOS)
              private static var hasSpeakerOverride = false
              private static var bluetoothReclaimAttempted = false
              private static func routeSummary(_ session: AVAudioSession) -> String {
                  let outputs = session.currentRoute.outputs.map { "\($0.portType.rawValue):\($0.portName)" }.joined(separator: ",")
                  return outputs.isEmpty ? "无" : outputs
              }
              #endif'''
          assert s.count(old_static) == 1, 'static block missing'
          s = s.replace(old_static, new_static)

          old_full = '''                    if session.category != .playAndRecord {
                                  try session.setCategory(.playAndRecord, mode: .default, options: options.union(.defaultToSpeaker))
                              }
                              var routedToBluetooth = false
                              for _ in 0..<4 {
                                  if session.currentRoute.outputs.contains(where: { $0.portType == .bluetoothA2DP }) {
                                      routedToBluetooth = true; break
                                  }
                                  Thread.sleep(forTimeInterval: 0.05)
                              }
                              if routedToBluetooth {
                                  onLog?("本机音频改走蓝牙 A2DP，跳过扬声器覆盖")
                              } else {
                                  do {
                                      try session.overrideOutputAudioPort(.speaker)
                                      Self.hasSpeakerOverride = true
                                      onLog?("本机音频避开 CarPlay 路由，改用 iPhone 扬声器")
                                  } catch {
                                      Self.deactivateSessionIfIdle()
                                      throw error
                                  }
                              }'''
          new_full = r'''                    onLog?("CarPlay 路由占用，当前输出：\(Self.routeSummary(session))")
                              var routedToBluetooth = false
                              if !Self.bluetoothReclaimAttempted {
                                  Self.bluetoothReclaimAttempted = true
                                  let reclaimCategory: AVAudioSession.Category = needsDuplexCategory ? .playAndRecord : .playback
                                  var reclaimOptions: AVAudioSession.CategoryOptions = [.allowBluetoothA2DP]
                                  if needsDuplexCategory { reclaimOptions.insert(.defaultToSpeaker) }
                                  if BackgroundKeepAlive.holdsAudioSession { reclaimOptions.insert(.mixWithOthers) }
                                  do {
                                      try session.setActive(false, options: .notifyOthersOnDeactivation)
                                      try session.setCategory(reclaimCategory, mode: .default, options: reclaimOptions)
                                      try session.setActive(true)
                                  } catch {
                                      onLog?("蓝牙接回尝试失败：\(error.localizedDescription)")
                                  }
                                  for _ in 0..<20 {
                                      if session.currentRoute.outputs.contains(where: { $0.portType == .bluetoothA2DP }) {
                                          routedToBluetooth = true; break
                                      }
                                      Thread.sleep(forTimeInterval: 0.1)
                                  }
                                  onLog?("蓝牙接回结果：\(routedToBluetooth ? "已接回 A2DP" : "未接回")，当前输出：\(Self.routeSummary(session))")
                              } else if session.currentRoute.outputs.contains(where: { $0.portType == .bluetoothA2DP }) {
                                  routedToBluetooth = true
                              }
                              if routedToBluetooth {
                                  Self.hasSpeakerOverride = false
                                  onLog?("本机音频改走蓝牙 A2DP，跳过扬声器覆盖")
                              } else {
                                  if session.category != .playAndRecord {
                                      try session.setCategory(.playAndRecord, mode: .default, options: options.union(.defaultToSpeaker))
                                  }
                                  do {
                                      try session.overrideOutputAudioPort(.speaker)
                                      Self.hasSpeakerOverride = true
                                      onLog?("本机音频避开 CarPlay 路由，改用 iPhone 扬声器")
                                  } catch {
                                      Self.deactivateSessionIfIdle()
                                      throw error
                                  }
                              }'''
          assert s.count(old_full) == 1, f'reclaim anchor sites = {s.count(old_full)}'
          s = s.replace(old_full, new_full)
          p.write_text(s, encoding='utf-8')
          changed.append('reclaim Bluetooth A2DP after CarPlay disableBluetooth')

          # ===== v10: 不再声明 media 音频格式，让音乐留在本机蓝牙（只保留通话/提示/语音）=====
          p = Path('src/App/CarPlayInfo.swift')
          s = p.read_text(encoding='utf-8')

          old_types = '''            let types: [(Int, String)] = [(100,"compatibility"),(101,"compatibility"),(100,"default"),
                          (100,"media"),(100,"alert"),(100,"telephony"),(100,"speechRecognition"),(101,"default")]'''
          new_types = '''            let types: [(Int, String)] = [(100,"compatibility"),(101,"compatibility"),(100,"default"),
                          (100,"alert"),(100,"telephony"),(100,"speechRecognition"),(101,"default")]'''
          assert s.count(old_types) == 1, 'types array missing'
          s = s.replace(old_types, new_types)

          old_profiles = '''                (100, "default", 0x30000050, 0x30000050),
                          (100, "media", 0x8800, 0),
                          (100, "alert", 0x40008800, 0),
                          (100, "telephony", 0x70000150, 0x70000150),
                          (100, "speechRecognition", 0x20000040, 0x20000040),
                          (101, "default", 0x40008800, 0),
                          (102, "media", 0xc00000, 0)'''
          new_profiles = '''                (100, "default", 0x30000050, 0x30000050),
                          (100, "alert", 0x40008800, 0),
                          (100, "telephony", 0x70000150, 0x70000150),
                          (100, "speechRecognition", 0x20000040, 0x20000040),
                          (101, "default", 0x40008800, 0)'''
          assert s.count(old_profiles) == 1, 'profiles array missing'
          s = s.replace(old_profiles, new_profiles)

          old_lat = '''            info["audioLatencies"] = (types + [(102,"media"),(102,"default")]).map { ["type": $0.0, "audioType": $0.1, "inputLatencyMicros": 0, "outputLatencyMicros": $0.0 == 102 ? 200000 : 50000] as [String: Any] }
                          + [100, 101, 102].map { ["type": $0, "inputLatencyMicros": 0, "outputLatencyMicros": $0 == 102 ? 200000 : 50000] as [String: Any] }'''
          new_lat = '''            info["audioLatencies"] = types.map { ["type": $0.0, "audioType": $0.1, "inputLatencyMicros": 0, "outputLatencyMicros": 50000] as [String: Any] }
                          + [100, 101].map { ["type": $0, "inputLatencyMicros": 0, "outputLatencyMicros": 50000] as [String: Any] }'''
          assert s.count(old_lat) == 1, 'latency block missing'
          s = s.replace(old_lat, new_lat)
          p.write_text(s, encoding='utf-8')
          changed.append('drop media audio formats (keep display + calls)')
          PY
          grep -n 'audioEnabled: true' src/App/ReceiverViewController.swift
          grep -n '公告通道第' src/App/TailingConnection.swift
          grep -n '当前 Wi-Fi' src/App/NativeReceiver.swift
          grep -n '蓝牙接回结果' src/App/CarPlayAudio.swift

      - name: Show toolchain
        run: |
          xcodebuild -version
          sw_vers

      - name: Build without signing
        working-directory: src
        run: |
          set -o pipefail
          xcodebuild -project TDSCarKit.xcodeproj -scheme TDSCarKit -configuration Release \
            -destination 'generic/platform=iOS' -sdk iphoneos \
            -derivedDataPath "$GITHUB_WORKSPACE/build" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee "$GITHUB_WORKSPACE/build.log" | tail -n 40

      - name: Surface compile errors
        if: always()
        run: |
          grep -E 'error:' "$GITHUB_WORKSPACE/build.log" | head -n 30 || true

      - name: Verify bundled identity
        run: |
          set -euo pipefail
          APP="$(find "$GITHUB_WORKSPACE/build/Build/Products/Release-iphoneos" -maxdepth 1 -name '*.app' | head -n1)"
          for f in certificate.p7b leaf.cer private.x963; do
            test -s "$APP/$f" || cp "ref/Payload/TDSCarKit.app/$f" "$APP/$f"
          done
          ls -l "$APP" | head -n 20

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP="$(find "$GITHUB_WORKSPACE/build/Build/Products/Release-iphoneos" -maxdepth 1 -name '*.app' | head -n1)"
          rm -rf stage
          mkdir -p stage/Payload
          cp -R "$APP" stage/Payload/
          cd stage
          zip -qry ../CarWithin-1.0.4-iOS16-v10-unsigned.ipa Payload
          ls -l ../CarWithin-1.0.4-iOS16-v10-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: CarWithin-1.0.4-iOS16-v10-unsigned
          path: CarWithin-1.0.4-iOS16-v10-unsigned.ipa
          if-no-files-found: error
